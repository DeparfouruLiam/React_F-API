name: Build and Push Docker Images

on:
  push:
    branches:
      - main  # ou master

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Cloner le repo
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Login Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3️⃣ Build et push backend
      - name: Build and Push Backend
        run: |
          TAG=${GITHUB_SHA::8}  # 8 premiers caractères du commit SHA
          docker build -t monuser/backend:latest -t monuser/backend:$TAG .
          docker push monuser/backend:latest
          docker push monuser/backend:$TAG

      # 4️⃣ Build et push frontend
      - name: Build and Push Frontend
        run: |
          docker build -t monuser/frontend:latest ./my-react-app
          docker push monuser/frontend:latest
